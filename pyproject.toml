[project]
name = "codewalk"
version = "0.1.0"
description = "Agent-authored, debugger-style visual walkthroughs of Python codebases"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "pydantic>=2.6",
    "typer>=0.12",
]

[project.optional-dependencies]
screenshot = ["playwright>=1.45"]

[project.scripts]
codewalk = "codewalk.cli:app"

[dependency-groups]
dev = [
    "pytest>=8",
    "pandas>=2.2",
    "numpy>=1.26",
    "matplotlib>=3.8",
    "playwright>=1.45",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/codewalk"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
